# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Ubuntu 20.04 Focal build (Qt 6 from artifact)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  QT_VERSION: 6.10.3
  QT_PREFIX: /opt/qt/6.10.3

jobs:
  build:
    name: Ubuntu 20.04 (Focal)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      CMAKE_VERSION: 3.31.8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Focal build environment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs build
          {
            echo '=== OS ==='
            cat /etc/os-release
            echo
            echo '=== Kernel ==='
            uname -a
            echo
            echo '=== CPU ==='
            nproc
          } | tee logs/00-environment.log

          apt-get update 2>&1 | tee logs/01-apt-update.log
          apt-get install -y --no-install-recommends \
            bash ca-certificates git wget curl xz-utils file pkg-config unzip \
            ninja-build build-essential python3 python3-pip sudo gdb \
            2>&1 | tee logs/02-base-packages.log

      - name: Install CMake
        shell: bash
        run: |
          set -o pipefail
          wget -qO- "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            | tar -xz -C /opt
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" /usr/local/bin/cmake
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest" /usr/local/bin/ctest
          cmake --version 2>&1 | tee logs/03-cmake-version.log

      - name: Install Mixxx build dependencies (Focal-compatible, no Qt)
        shell: bash
        run: |
          set -o pipefail
          export DEBIAN_FRONTEND=noninteractive
          # The current Mixxx buildenv asks Focal for Qt6 and PipeWire packages
          # which do not exist there. Qt is supplied by the qt6-focal artifact.
          cp tools/debian_buildenv.sh /tmp/debian_buildenv-focal.sh
          apt-get install -y --no-install-recommends gcc-10 g++-10 2>&1 | tee logs/04-focal-toolchain.log
          # The custom-built Qt 6.10 enables xkbcommon, so Qt6GuiPrivate
          # needs libxkbcommon-dev present at Mixxx build time. Focal ships
          # xkbcommon 0.9.1 (>= the required 0.9.0).
          apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev 2>&1 | tee logs/04-xkbcommon.log
          # Qt's qsb shader baker is invoked during the build and needs the
          # dbus runtime library, which our Qt6 deb filtering removes.
          apt-get install -y --no-install-recommends libdbus-1-3 2>&1 | tee logs/04-dbus.log
          sed -i \
            -e '/libpipewire-0.3-dev/d' \
            -e '/libspa-0.2-dev/d' \
            -e '/libqt6/d' \
            -e '/^ *qt6-/d' \
            -e '/^ *qtkeychain-qt6-dev/d' \
            -e '/^ *qml6-/d' \
            -e '/qt6-shadertools-dev/d' \
            -e '/qt6-5compat-dev/d' \
            -e 's/sudo apt-get/apt-get/g' \
            /tmp/debian_buildenv-focal.sh
          chmod +x /tmp/debian_buildenv-focal.sh
          /tmp/debian_buildenv-focal.sh setup 2>&1 | tee logs/04-mixxx-buildenv.log

      - name: Build hidapi 0.14.0 (Focal ships 0.9.0)
        shell: bash
        run: |
          set -o pipefail
          # Mixxx needs hidapi >= 0.14.0 for controller bus-type info, but Focal
          # only ships 0.9.0. The 0.14.0 GitHub release ships no source tarball,
          # so pull the tag archive from codeload; its CMake install drops
          # hidapiConfig.cmake into /usr/local/lib/cmake/hidapi.
          wget -q "https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.14.0.tar.gz" -O /tmp/hidapi.tar.gz
          tar -xzf /tmp/hidapi.tar.gz -C /tmp
          cmake -S /tmp/hidapi-hidapi-0.14.0 -B /tmp/hidapi-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DHIDAPI_BUILD_HIDTEST=OFF
          cmake --build /tmp/hidapi-build -j"$(nproc)" 2>&1 | tee logs/05-hidapi-build.log
          cmake --install /tmp/hidapi-build 2>&1 | tee logs/05-hidapi-install.log

      - name: Find Qt artifact build
        id: find-qt
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'qt6-focal.yml',
              status: 'success',
              per_page: 1,
            });
            if (data.total_count === 0) {
              core.setFailed('No successful qt6-focal.yml run found; run that workflow first.');
            }
            const run = data.workflow_runs[0];
            core.setOutput('run_id', String(run.id));
            console.log(`Using Qt build run ${run.id}`);

      - name: Download Qt artifact
        id: download-qt
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ steps.find-qt.outputs.run_id }}
        with:
          # download-artifact@v4 cannot fetch artifacts from a different
          # workflow file (qt6-focal.yml) via run-id, so fetch the archive
          # through the REST API instead.
          script: |
            const fs = require('fs');
            const dir = '/tmp/qt-artifact';
            fs.mkdirSync(dir, { recursive: true });
            const artifactName = `qt-${process.env.QT_VERSION}-ubuntu20.04`;
            const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.RUN_ID),
            });
            const artifact = list.artifacts.find(a => a.name === artifactName);
            if (!artifact) {
              core.setFailed(`Artifact ${artifactName} not found on run ${process.env.RUN_ID}`);
              return;
            }
            const { data } = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync(`${dir}/qt.zip`, Buffer.from(data));
            console.log(`Downloaded ${artifactName} (${artifact.size_in_bytes} bytes) from run ${process.env.RUN_ID}`);

      - name: Install Qt artifact
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/qt-artifact
          unzip -o qt.zip
          # The sha256 sidecar records the path 'artifacts/...' from the
          # upstream build, so verify by digest instead of sha256sum -c.
          expected=$(awk '{print $1}' "qt-${QT_VERSION}-ubuntu20.04.tar.xz.sha256")
          actual=$(sha256sum "qt-${QT_VERSION}-ubuntu20.04.tar.xz" | awk '{print $1}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          test "${expected}" = "${actual}" || { echo "Qt artifact checksum mismatch" >&2; exit 1; }
          mkdir -p /opt/qt
          tar -C /opt/qt -xJf "qt-${QT_VERSION}-ubuntu20.04.tar.xz" 2>&1 | tee "${GITHUB_WORKSPACE}/logs/05-qt-install.log"
          "${QT_PREFIX}/bin/qmake" --version 2>&1 | tee -a "${GITHUB_WORKSPACE}/logs/05-qt-install.log"

      - name: Configure
        shell: bash
        env:
          CMAKE_PREFIX_PATH: /opt/qt/6.10.3
          LD_LIBRARY_PATH: /opt/qt/6.10.3/lib
          CC: gcc-10
          CXX: g++-10
        run: |
          set -o pipefail
          export PATH=/opt/qt/6.10.3/bin:$PATH
          # Debug build with -g3 (CMake's Debug default is -g): keeps macro
          # definitions and full local/parameter info for gdb sessions.
          cmake \
            -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG=-g3 \
            -DCMAKE_CXX_FLAGS_DEBUG=-g3 \
            -DQT6=ON \
            -DQML=ON \
            -DBULK=ON \
            -DFFMPEG=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DBUILD_BENCH=OFF \
            -DQTKEYCHAIN=OFF \
            -DINSTALL_USER_UDEV_RULES=OFF \
            2>&1 | tee logs/06-cmake-configure.log

      - name: Build
        shell: bash
        env:
          CMAKE_PREFIX_PATH: /opt/qt/6.10.3
          LD_LIBRARY_PATH: /opt/qt/6.10.3/lib
          CC: gcc-10
          CXX: g++-10
        run: |
          set -o pipefail
          export PATH=/opt/qt/6.10.3/bin:$PATH
          cmake --build build -j "$(nproc)" 2>&1 | tee logs/07-cmake-build.log

      - name: Run tests
        if: success()
        shell: bash
        env:
          LD_LIBRARY_PATH: /opt/qt/6.10.3/lib
        run: |
          set -o pipefail
          if compgen -G "build/mixxx-test*" >/dev/null; then
            ctest --test-dir build --output-on-failure 2>&1 | tee logs/08-ctest.log
          else
            echo "No test targets built (BUILD_TESTING=OFF: Focal libgtest-dev ships no GTest CONFIG package); skipping ctest"
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '=== Git status ==='
            git status --short
            echo
            echo '=== CMake cache ==='
            grep -E '^(CMAKE_(BUILD_TYPE|C_FLAGS_DEBUG|CXX_FLAGS_DEBUG|CXX_COMPILER|C_COMPILER):|QT6:|FFMPEG:)' build/CMakeCache.txt 2>/dev/null || true
            echo
            echo '=== Qt ==='
            "${QT_PREFIX}/bin/qmake" --version 2>/dev/null || true
            echo
            echo '=== Built files ==='
            find build -maxdepth 3 -type f \( -name '*.deb' -o -name 'mixxx' \) -print 2>/dev/null || true
          } | tee logs/99-diagnostics.log

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-20.04-qt6-${{ github.run_number }}
          path: |
            logs/
            build/*.deb
            build/mixxx
          if-no-files-found: warn
          retention-days: 14
