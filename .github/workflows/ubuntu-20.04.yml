# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Ubuntu 20.04 Focal build

on:
  push:
    # Stale experiment: expects a pre-installed Qt that never exists in a
    # fresh Focal container, so it always fails. Don't run it on every push
    # (it only wastes the runner pool); trigger only when edited.
    paths:
      - '.github/workflows/ubuntu-20.04.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.10.3
  QT_PREFIX: /opt/qt/6.10.3

jobs:
  build:
    name: Ubuntu 20.04 (Focal)
    runs-on: ubuntu-24.04
    container: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      CMAKE_VERSION: 3.31.8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Focal build environment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs build
          {
            echo '=== OS ==='
            cat /etc/os-release
            echo
            echo '=== Kernel ==='
            uname -a
            echo
            echo '=== CPU ==='
            nproc
          } | tee logs/00-environment.log

          apt-get update 2>&1 | tee logs/01-apt-update.log
          apt-get install -y --no-install-recommends \
            bash ca-certificates git wget curl xz-utils file pkg-config \
            ninja-build build-essential python3 python3-pip sudo \
            2>&1 | tee logs/02-base-packages.log

      - name: Install CMake
        shell: bash
        run: |
          set -o pipefail
          wget -qO- "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            | tar -xz -C /opt
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/cmake" /usr/local/bin/cmake
          ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/ctest" /usr/local/bin/ctest
          cmake --version 2>&1 | tee logs/03-cmake-version.log

      - name: Install Mixxx build dependencies
        shell: bash
        run: |
          set -o pipefail
          chmod +x tools/debian_buildenv.sh
          ./tools/debian_buildenv.sh setup 2>&1 | tee logs/04-mixxx-buildenv.log

      - name: Verify Qt 6
        shell: bash
        run: |
          set -o pipefail
          if [ ! -x "${QT_PREFIX}/bin/qmake" ]; then
            echo "ERROR: Qt ${QT_VERSION} was not found at ${QT_PREFIX}" | tee logs/05-qt-check.log
            exit 1
          fi
          "${QT_PREFIX}/bin/qmake" --version 2>&1 | tee logs/05-qt-check.log

      - name: Configure
        shell: bash
        env:
          PATH: /opt/qt/6.10.3/bin:${{ env.PATH }}
          CMAKE_PREFIX_PATH: /opt/qt/6.10.3
        run: |
          set -o pipefail
          cmake \
            -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-g3 -O0 -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-g3 -O0 -fno-omit-frame-pointer" \            
            -DQT6=ON \
            -DQML=ON \
            -DBULK=ON \
            -DFFMPEG=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            2>&1 | tee logs/06-cmake-configure.log

      - name: Show compiler flags
        shell: bash
        run: |
          echo "=== CMAKE CXX FLAGS ==="
          grep -E 'CMAKE_CXX_FLAGS|CMAKE_C_FLAGS' build/CMakeCache.txt || true

          echo
          echo "=== Compile commands ==="
          find build -name compile_commands.json -exec grep -m 5 -E 'soundsourceffmpeg.cpp' {} \; || true

      - name: Build
        shell: bash
        env:
          PATH: /opt/qt/6.10.3/bin:${{ env.PATH }}
          CMAKE_PREFIX_PATH: /opt/qt/6.10.3
        run: |
          set -o pipefail
          cmake --build build -j "$(nproc)" 2>&1 | tee logs/07-cmake-build.log

      - name: Run tests
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee logs/08-ctest.log

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '=== Git status ==='
            git status --short
            echo
            echo '=== CMake cache ==='
            grep -E '^(CMAKE_(BUILD_TYPE|CXX_COMPILER|C_COMPILER):|QT6:|FFMPEG:)' build/CMakeCache.txt 2>/dev/null || true
            echo
            echo '=== Qt ==='
            "${QT_PREFIX}/bin/qmake" --version 2>/dev/null || true
            echo
            echo '=== Built files ==='
            find build -maxdepth 3 -type f \( -name '*.deb' -o -name 'mixxx' \) -print 2>/dev/null || true
          } | tee logs/99-diagnostics.log

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-20.04-focal-${{ github.run_number }}
          path: |
            logs/
            build/*.deb
            build/mixxx
          if-no-files-found: warn
          retention-days: 14

      - name: Install
        shell: bash
        run: |
          set -o pipefail
          cmake --install build --prefix /opt/mixxx 2>&1 | tee logs/09-cmake-install.log

      - name: Stage installed files
        if: always()
        shell: bash
        run: |
          set -o pipefail
          rm -rf installed-mixxx
          mkdir -p installed-mixxx
          cp -a /opt/mixxx/. installed-mixxx/

      - name: Upload installed Mixxx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-20.04-focal-installed-${{ github.run_number }}
          path: installed-mixxx/
          if-no-files-found: warn
          retention-days: 14

      - name: Run tests2
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure \
            2>&1 | tee logs/10-ctest.log




